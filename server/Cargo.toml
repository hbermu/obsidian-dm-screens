[package]
name = "dm-screen-server"
version = "0.0.0"
edition = "2024"
# The released version is the plugin's: scripts/export-screens.mjs writes it to
# assets/version.txt and the binary reports that.
publish = false

[dependencies]
axum = { version = "0.8.9", features = ["ws", "macros"] }
bytes = "1.12.2"
futures-util = "0.3.34"
hex = "0.4.3"
indexmap = { version = "2.14.2", features = ["serde"] }
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "multipart", "rustls", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
serde_urlencoded = "0.7.1"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.9"

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
tempfile = "3.27.0"
tokio-tungstenite = "0.30.0"
