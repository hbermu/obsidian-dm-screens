# Dev environment for the dm-screen Obsidian plugin.
# Everything runs in containers — no Node, Obsidian, or vault on the host.
#
# Quick start:
#   make up         # build watcher + Obsidian (https://localhost:3001)
#   make build      # one-shot production build
#   make typecheck  # tsc --noEmit
#   make test       # vitest run

services:

  builder:
    image: node:22-alpine
    working_dir: /app
    environment:
      BUILD_OUT: /plugin-out
    volumes:
      - .:/app
      - node_modules:/app/node_modules  # container-only (host's may be wrong arch)
      - ./.dev/vault/.obsidian/plugins/dm-screen:/plugin-out
    command: >
      sh -c "
        npm install --no-audit --no-fund &&
        mkdir -p /plugin-out &&
        sh scripts/bootstrap-hot-reload.sh &&
        touch /plugin-out/.hotreload &&
        node esbuild.config.mjs
      "

  obsidian:
    image: lscr.io/linuxserver/obsidian:latest
    depends_on:
      - builder
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/Madrid
    ports:
      - "3001:3001"   # KasmVNC HTTPS (Obsidian GUI)
      - "3000:3000"   # DM Screen player server (plugin opens this from inside the container)
    volumes:
      - ./.dev/config:/config
      - ./.dev/vault:/vaults/dm-test
    shm_size: "1gb"
    restart: unless-stopped

  typecheck:
    image: node:22-alpine
    profiles: ["tools"]
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: >
      sh -c "
        npm install --no-audit --no-fund &&
        npx tsc --noEmit
      "

  test:
    image: node:22-alpine
    profiles: ["tools"]
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: >
      sh -c "
        npm install --no-audit --no-fund &&
        npx vitest run
      "

  # Black-box conformance suite (test/conformance/): the viewer contract both
  # servers implement. CONFORMANCE_TARGET picks the server under test.
  conformance:
    image: node:22-alpine
    profiles: ["tools"]
    working_dir: /app
    environment:
      CONFORMANCE_TARGET: ${CONFORMANCE_TARGET:-embedded}
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: >
      sh -c "
        npm install --no-audit --no-fund &&
        npx tsc -p test/conformance --noEmit &&
        npx vitest run -c vitest.conformance.config.mts
      "

  # Rust toolchain for the remote server (server/): cargo test, clippy, fmt.
  # The screens it embeds come from `make server-screens`.
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
      target: dev
    profiles: ["tools"]
    working_dir: /app/server
    environment:
      CARGO_TARGET_DIR: /target
    volumes:
      - .:/app
      - cargo_registry:/usr/local/cargo/registry
      - server_target:/target

  # The conformance suite against the remote server binary, which the remote
  # driver starts per test with a fresh data directory. Own node_modules: this
  # glibc image cannot use the alpine services' native binaries.
  conformance-remote:
    build:
      context: .
      dockerfile: server/Dockerfile
      target: conformance
    profiles: ["tools"]
    working_dir: /app
    environment:
      CONFORMANCE_TARGET: remote
      DM_SCREEN_SERVER_BIN: /usr/local/bin/dm-screen-server
    volumes:
      - .:/app
      - conformance_modules:/app/node_modules
    command: >
      sh -c "
        npm install --no-audit --no-fund &&
        npx tsc -p test/conformance --noEmit &&
        npx vitest run -c vitest.conformance.config.mts
      "

  # Dependency maintenance. Writes package-lock.json through the bind mount while
  # keeping node_modules in the container-only volume, so the host never needs a
  # JS toolchain (see AGENTS.md).
  deps:
    image: node:22-alpine
    profiles: ["tools"]
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    entrypoint: ["sh", "-c"]
    command: ["npm audit"]

  # Keep image tag in sync with @playwright/test in package.json. Dependabot
  # bumps the two in separate PRs (docker-compose vs npm); merge them together.
  # Uses its own node_modules volume — alpine vs jammy musl/glibc binaries (esbuild,
  # playwright browsers) are not interchangeable with the other services'.
  visual:
    image: mcr.microsoft.com/playwright:v1.64.1-jammy
    profiles: ["tools"]
    working_dir: /app
    environment:
      TZ: Europe/Madrid
      CI: "1"
    volumes:
      - .:/app
      - playwright_modules:/app/node_modules
    command: >
      sh -c "
        npm install --no-audit --no-fund &&
        npx playwright test
      "

  # Real-Obsidian e2e (wdio-obsidian-service): downloads Obsidian + chromedriver
  # into .obsidian-cache/, boots real Electron under Xvfb and drives it. Same
  # jammy Playwright base as `visual` (glibc + GUI libs + xvfb preinstalled);
  # own node_modules volume — jammy binaries are not interchangeable with the
  # alpine services'. No published ports: specs reach the plugin's server on
  # localhost inside this container.
  e2e:
    image: mcr.microsoft.com/playwright:v1.64.1-jammy
    profiles: ["tools"]
    working_dir: /app
    # platform: linux/amd64  # uncomment if obsidian-launcher has no linux-arm64 asset for the requested version
    environment:
      TZ: Europe/Madrid
      CI: "1"
      OBSIDIAN_VERSIONS: ${OBSIDIAN_VERSIONS:-latest/latest}
      E2E_SPEC: ${E2E_SPEC:-}
      APPIMAGE_EXTRACT_AND_RUN: "1"
    shm_size: "1gb"
    volumes:
      - .:/app
      - e2e_modules:/app/node_modules
    command: >
      sh -c "
        npm install --no-audit --no-fund &&
        npx tsc -p test/e2e --noEmit &&
        npm run build &&
        xvfb-run -a npx wdio run wdio.conf.mts
      "

volumes:
  node_modules: {}
  playwright_modules: {}
  e2e_modules: {}
  conformance_modules: {}
  cargo_registry: {}
  server_target: {}
